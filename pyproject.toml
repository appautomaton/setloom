# SPDX-License-Identifier: AGPL-3.0-only

[project]
name = "setloom"
version = "0.1.0"
description = "Open-source, keyboard-first tool and agentic harness for generating, tuning, mixing, and sequencing club tracks and DJ sets."
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0", "matplotlib>=3.7", "mido>=1.3", "numpy>=2.4.6",
    "pedalboard>=0.9.23", "pydantic>=2.7", "pyloudnorm>=0.2.0", "pyyaml>=6.0",
    "scipy>=1.17.1", "soundfile>=0.14.0",
]

[project.scripts]
setloom = "setloom.cli:run"

[dependency-groups]
ableton-mcp = ["mcp[cli]>=1.3.0", "supabase>=2.0.0"]
anatomy = ["essentia==2.1b6.dev1389", "mlx>=0.31.0", "mlx-spectro>=0.2.4", "torch>=2.12.0", "torchfcpe>=0.0.4"]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Kong (ByteDance) piano transcription for `transcribe --engine kong|fusion`. Kept out of
# `transcription` so the default Basic Pitch path stays CoreML-only and torch-free.
kong = ["piano-transcription-inference>=0.0.4", "torch>=2.12.0"]
# Pianist Transformer (yhj137) expressive performance rendering. `transformers` is pinned to
# 4.54.0 for its t5gemma internals; it is torch-agnostic, so it rides our pinned torch (the
# project never downgrades torch -- we port model code to our torch, not the reverse).
pianist = ["transformers==4.54.0", "miditoolkit==1.0.1", "huggingface-hub>=0.35", "tqdm>=4.66", "torch>=2.12.0"]
supercollider = ["supriya==26.3b0"]
transcription = ["coremltools>=9.0"]
# Reference pitch probes are separate so Basic Pitch does not install torch.
pitch-probes = ["torchcrepe>=0.0.24", "torch>=2.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setloom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
